name: OK.ru Live Stream

on:
  workflow_dispatch:
    inputs:
      stream_key_id:
        description: 'Select OK.ru Stream Key ID (1, 1.1, 1.2, etc.)'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '1.1'
          - '1.2'
          - '1.3'
          - '2'
          - '2.1'
          - '2.2'
      stream_url:
        description: 'Target Website / Player URL'
        required: true
        type: string
        default: 'https://thedaddy.li/stream/stream-598.php'
      duration_minutes:
        description: 'Stream Duration in Minutes (e.g., 60, 120, 180, 240)'
        required: true
        type: string
        default: '240'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Chrome, Xvfb, PulseAudio, and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            pulseaudio \
            pulseaudio-utils \
            ffmpeg \
            dbus-x11 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            xdg-utils \
            wget \
            ca-certificates
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm -f google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Install Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Start virtual display, audio sink, and broadcast to OK.ru
        env:
          DISPLAY: ':99'
          CHROME_PATH: '/usr/bin/google-chrome'
          AUDIO_SOURCE: 'virtual_speaker.monitor'
          RESOLUTION: '1280x720'
          FPS: '30'
          STREAM_KEY_ID: ${{ github.event.inputs.stream_key_id }}
          STREAM_URL: ${{ github.event.inputs.stream_url }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          sleep 2

          pulseaudio --kill || true
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=Virtual_Speaker
          pactl set-default-sink virtual_speaker

          npm start
