name: Stream

on:
  workflow_dispatch:
    inputs:
      target_urls:
        description: HTTP(S) source URLs, separated by pipes or commas
        type: string
        required: true
      okru_stream_channel:
        description: OK.ru channel from stream.js
        type: string
        default: '1'
      server_selection:
        description: Label of a server button, or None
        type: string
        default: None
      stream_quality:
        description: Output resolution
        type: choice
        default: 720p
        options: [360p, 480p, 720p, 1080p]
      enable_stream_audio:
        description: Capture audio
        type: choice
        default: 'ON'
        options: ['ON', 'OFF']
      custom_duration:
        description: Finite duration from 1s to 5h 50m
        type: string
        default: 10m

permissions:
  contents: read

concurrency:
  group: stream-${{ inputs.okru_stream_channel }}
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils xauth xvfb
          npm install --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.43.1
      - name: Stream
        env:
          TARGET_URLS: ${{ inputs.target_urls }}
          OKRU_STREAM_ID: ${{ inputs.okru_stream_channel }}
          SERVER_SELECTION: ${{ inputs.server_selection }}
          STREAM_QUALITY: ${{ inputs.stream_quality }}
          ENABLE_STREAM_AUDIO: ${{ inputs.enable_stream_audio }}
          CUSTOM_DURATION: ${{ inputs.custom_duration }}
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -x "$PUPPETEER_EXECUTABLE_PATH"
          screen="$(node -p 'const { width, height } = require("./stream.js").loadConfig(process.env); width + "x" + height')"

          if [[ "$ENABLE_STREAM_AUDIO" == ON ]]; then
            if ! pactl info >/dev/null 2>&1; then
              pulseaudio --start --exit-idle-time=-1
            fi
            sink_module="$(pactl load-module module-null-sink sink_name=stream_capture rate=48000 channels=2)"
            trap 'pactl unload-module "$sink_module" >/dev/null 2>&1 || true' EXIT
            export PULSE_SINK=stream_capture
          fi

          xvfb-run -a -s "-screen 0 ${screen}x24 -nolisten tcp" node stream.js
